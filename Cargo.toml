[package]
name = "kindle-manga"
version = "1.0.0"
edition = "2021"
description = "Kindle 原生漫画阅读器（Rust + Slint + E Ink）"
license = "GPL-3.0-only"
repository = "https://github.com/wujunhua0713ww/jm-for-kindle"
readme = "README.md"
keywords = ["kindle", "eink", "manga", "slint", "rust"]
categories = ["gui"]

# 把 vendor 的副本纳入 workspace，只为一件事：让它的单元测试能被 `cargo test`
# 跑到。刷新策略的「每 N 次全刷一次」是纯计数逻辑，用测试钉住比上真机试快得多
# （真机上只能靠眼睛看闪不闪）。
[workspace]
members = ["vendor/slint-backend-kindle"]

[features]
default = []
# 真机 / 模拟环境：走 E Ink 帧缓冲后端
kindle = ["dep:slint-backend-kindle"]
# 桌面预览：走 Slint 自带的 winit 窗口后端。
#
# 注意这里**只用 backend-winit，不切 renderer-femtovg**：
# 真机跑的是软件渲染器（上面 features 里的 renderer-software），
# 桌面预览用同一个渲染器，看到的排版、抗锯齿、字体度量才和 Kindle 上一致 ——
# 这正是「用桌面版改 UI」这件事的价值所在。
# 换成 femtovg（OpenGL）虽然更快，但渲染细节会有出入，改出来的 UI 到真机上会变样。
desktop = ["slint/backend-winit"]

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "std",
    "renderer-software",
] }
# HTTP 用手写的 std::net 实现（见 src/api.rs 顶部注释），不再需要 ureq
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图片格式必须覆盖服务端可能发来的原格式。
# jm_kindle_raw.py 这一版是「保持原格式直发」的（多半是 webp），
# 所以 webp 解码器是必需的，不是可选项；png/gif 同理（gif 可能是动图）。
# pnm 只给 --demo 模式的本地测试图用。
# 解不动的格式有兜底：带上 ?force=jpeg 让服务端转，见 src/main.rs 的 fetch_page_bytes_jpeg。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "pnm",
] }
log = "0.4"
# 只为了 ioctl(EVIOCGBIT/EVIOCGRAB)：识别「哪个输入节点是电源键」需要它。
# libc 本来就在依赖树里（slint-backend-kindle 用的），显式列出来不增加体积。
libc = "0.2"

[target.'cfg(target_arch = "arm")'.dependencies]
# ⚠️ 从 vendor/ 走本地路径，**不是** crates.io 的 0.7。
#
# 原因：上游把 Framebuffer 和 refresh_full() 都设为私有，应用层没有任何办法
# 触发全屏刷新；而 Kindle 的残影只能靠定期全刷清掉。vendor 副本里加了一个
# 刷新策略（vendor/slint-backend-kindle/src/refresh.rs），公开
# KindleBackend::full_refresh_policy()。
#
# 升级上游时别直接改回版本号 —— 先把 refresh.rs 和那几行接线重新套一遍，
# 步骤见 vendor/slint-backend-kindle/PATCH.md。
slint-backend-kindle = { path = "vendor/slint-backend-kindle", optional = true }

[build-dependencies]
slint-build = "1.18"

# 真机部署：体积优先
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
